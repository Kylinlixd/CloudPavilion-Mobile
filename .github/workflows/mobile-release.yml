name: Mobile Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  release:
    name: Build Android and iOS release
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: |
          npm run typecheck
          npm run lint
          npm test -- --run
          npx expo-doctor

      - name: Link or create EAS project
        run: npx eas-cli project:init --account kylinlees-team --non-interactive

      - name: Build Android production
        run: |
          npx eas-cli build --platform android --profile production --non-interactive --wait --json > android-build.json
          jq -er 'if type == "array" then .[0].id else .id end' android-build.json > android-build-id.txt

      - name: Build iOS Simulator
        run: |
          npx eas-cli build --platform ios --profile simulator --non-interactive --wait --json > ios-build.json
          jq -er 'if type == "array" then .[0].id else .id end' ios-build.json > ios-build-id.txt

      - name: Download Android artifact
        run: |
          mkdir -p artifacts/android
          npx eas-cli build:download --build-id "$(cat android-build-id.txt)" --non-interactive
          find . -maxdepth 1 -type f \( -name '*.apk' -o -name '*.aab' \) -exec mv {} artifacts/android/ \;
          if ! find artifacts/android -type f -print -quit | grep -q .; then
            echo "No Android artifact was downloaded"
            exit 1
          fi

      - name: Download iOS artifact
        run: |
          mkdir -p artifacts/ios
          npx eas-cli build:download --build-id "$(cat ios-build-id.txt)" --non-interactive
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.ipa' \) -exec mv {} artifacts/ios/ \;
          if ! find artifacts/ios -type f -print -quit | grep -q .; then
            echo "No iOS Simulator artifact was downloaded"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/android/*
            artifacts/ios/*
